
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – CPRIT Formation</title>
  <link rel="stylesheet" href="connexion.css">
</head>
<body>
  <header>
    <img src="assets/logo-cprit.png" alt="Logo CPRIT">
    <div>
      <h1>CPRIT</h1>
      <p>Plateforme de formation en ligne</p>
    </div>
  </header>

  <main>
    <section class="form-card">
      <h2>Connexion apprenant</h2>
      <p class="intro">Connectez-vous pour accéder à votre espace personnel.</p>

      <form id="loginForm">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" required placeholder="Votre adresse e-mail">

        <label for="password">Mot de passe</label>
        <input id="password" type="password" required placeholder="Votre mot de passe">

        <button type="submit" id="loginButton">Se connecter</button>
      </form>

      <div id="message" role="status"></div>

      <p>Pas encore inscrit ?
        <a href="inscription.html">Créer un compte</a>
      </p>

      <a class="back-link" href="index.html">Retour au site CPRIT</a>
    </section>
  </main>

  <footer>© CPRIT – Centre pédagogique régional de l’ICESCO au Tchad</footer>

  <script type="module" src="connexion.js"></script>
</body>
</html>
